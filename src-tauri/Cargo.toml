[package]
name = "b-listener"
version = "0.1.0"
description = "AI議事録デスクトップアプリ"
edition = "2021"
rust-version = "1.77"

[lib]
name = "b_listener_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# 音声入力。Windows(WASAPI) / macOS(CoreAudio) を単一APIで扱う。
cpal = "0.15"
# デバイスのサンプルレート -> 16kHz への高品質リサンプル。
rubato = "0.16"

# HTTP。用途は「モデルのダウンロード」と「localhost の Ollama」のみ。
# 会議データを外部へ送るコードは存在させない。
ureq = "2.10"

[target.'cfg(target_os = "macos")'.dependencies]
# whisper.cpp を同梱する。macOS では Metal による GPU 実行を有効にする。
whisper-rs = { version = "0.14", features = ["metal", "tracing_backend"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.14", features = ["tracing_backend"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
# モックアプリを組み立てて、パイプライン全体を統合テストするために使う。
tauri = { version = "2", features = ["test"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
